<font color="white" size="+2">
    <b>{title}</b>
</font>
<br/>
<font color="silver" size="-1">on map</font>&nbsp; <font color="GoldenRod">
    <b>{mapdisplayname}</b>
</font>
<table border="0" cellpadding="0" cellspacing="0" width="250">
    <tbody>
        <tr>
            <td>
                <font color="silver">
                    <font size="-1">with</font>&nbsp; <b>{players} / {mapslots} {playerstring}</b>
            </td>
            <td align="right">
                <font color="silver" size="-1">Age</font>
                <font color="silver">{age}</font>
            </td>
        </tr>
        <tr>
            <td>
                <font size="-1" color="red">mod</font>&nbsp; <font color="white">
                    <b>{mod}</b>
                </font>
            </td>
            <td align="right">
                <font size="-1" color="red">
                    <b>{simmods}</b>
                </font>
            </td>
        </tr>
        <tr>
            <td>
                <font color="silver" size="-1">by</font>&nbsp;
                <font color="{color}">
                    <b>{host}</b>
                </font>
            </td>
            <td align="right">
                <b>
                    <font color="silver" size="-1">Avg. Rating</font>
                    <font color="silver" size="+1">{avgrating}</font>
                </b>
            </td>
        </tr>
    </tbody>
</table>
